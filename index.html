<style>
  :root { --ink:#1d2733; --muted:#5b6876; --line:#d5dbe2; --accent:#1f2d3d; --bad:#c0392b; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#f4f6f8; color:var(--ink);
         font-family:-apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .card { width:min(360px, 92vw); background:#fff; border:1px solid var(--line); border-radius:14px;
          padding:32px 28px 26px; box-shadow:0 6px 24px rgba(29,39,51,.08); text-align:center; }
  .card img { width:72px; height:72px; }
  h1 { margin:10px 0 4px; font-size:22px; letter-spacing:.06em; }
  p { margin:0 0 20px; color:var(--muted); font-size:14px; }
  input[type=password] { width:100%; padding:11px 12px; font-size:16px; border:1px solid var(--line);
          border-radius:8px; outline:none; }
  input[type=password]:focus { border-color:var(--accent); }
  label { display:flex; gap:8px; align-items:center; justify-content:flex-start; margin:12px 2px 0;
          font-size:13px; color:var(--muted); cursor:pointer; }
  button { width:100%; margin-top:16px; padding:11px; font-size:15px; border:0; border-radius:8px;
           background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  .msg { min-height:18px; margin-top:12px; font-size:13px; color:var(--bad); }
</style>
</head>

    var saved = JSON.parse(localStorage.getItem(STORE) || 'null');
    if (saved && saved.salt === P.salt) {
      document.documentElement.style.visibility = 'hidden';  // no gate flash for remembered readers
      crypto.subtle.importKey('raw', b64(saved.key), 'AES-GCM', false, ['decrypt'])
        .then(decrypt).then(show)
        .catch(function () {
          localStorage.removeItem(STORE);
          document.documentElement.style.visibility = '';
        });
    }
  } catch (e) { localStorage.removeItem(STORE); }

  var form = document.getElementById('gate'), msg = document.getElementById('msg'),
      btn = document.getElementById('go');
  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var pw = document.getElementById('pw').value.toLowerCase().replace(/[^a-z0-9]/g, '');
    if (!pw) return;
    btn.disabled = true; btn.textContent = 'Unlocking…'; msg.textContent = '';
    var key;
    derive(pw).then(function (k) { key = k; return decrypt(k); })
      .then(function (html) {
        if (!document.getElementById('remember').checked) return html;
        return crypto.subtle.exportKey('raw', key).then(function (raw) {
          localStorage.setItem(STORE, JSON.stringify({ salt: P.salt, key: toB64(raw) }));
          return html;
        });
      })
      .then(show)
      .catch(function () {
        btn.disabled = false; btn.textContent = 'Open';
        msg.textContent = 'Incorrect password.';
      });
  });
})();
</script>
</body>
</html>
